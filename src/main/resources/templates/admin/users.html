<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/site.css}">
  <title>Users — Admin</title>
<script defer th:src="@{/js/site.js}"></script>
</head>
<body class="admin-page" th:attr="data-context=@{/}"><a class="skip-link" href="#content">Skip to content</a>
<header th:replace="~{fragments/navigation :: header(compactHeader=true)}"></header>
<main id="content"><div class="section-line"><span>THE ADMINISTRATION DESK</span><span>REVIEW / RESOLVE / KEEP RECORD</span></div>

<nav class="admin-nav" aria-label="Administration"><a th:href="@{/admin/dashboard}">Overview</a><a th:href="@{/admin/users}">Users</a><a th:href="@{/admin/listings}">Listings</a><a th:href="@{/admin/transactions}">Transactions</a><a th:href="@{/admin/disputes}">Disputes</a></nav><h1>Users</h1>

<div th:if="${message}"><b th:text="${message}"></b></div>
<div role="alert" th:if="${error}"><b>Error:</b> <span th:text="${error}"></span></div>

<div class="table-scroll" tabindex="0" aria-label="Scrollable records"><table >
  <thead>
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>Role</th>
      <th>Registered</th><th>Status</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
  <tr th:each="user : ${users}">
    <td th:text="${user.userId}"></td>
    <td th:text="${user.username}"></td>
    <td th:text="${user.role}"></td>
    <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}"></td>
    <td th:text="${user.active ? 'Active' : 'Deactivated'}"></td>
    <td>
      <form th:if="${!user.admin and user.active}" method="post"
            th:action="@{/admin/users/{id}/deactivate(id=${user.userId})}"
            data-confirm="Deactivate this account? Sign-in will be blocked and its listings hidden. Existing records will be retained." data-confirm-title="Deactivate this account?" data-confirm-action="Deactivate account" data-confirm-cancel="Keep account active" data-confirm-tone="destructive"
            style="display:inline;"><input type="hidden" name="_csrf" th:value="${csrf}">
        <button type="submit">Deactivate</button>
      </form>
      <span th:if="${user.admin}">protected</span>
    </td>
  </tr>
  </tbody>
</table></div>
<nav class="pagination" th:if="${page != null}" aria-label="Pagination"><a th:if="${page > 0}" th:href="@{''(page=${page - 1},keyword=${param.keyword},category=${param.category})}">Previous</a><span th:text="${'Page ' + (page + 1)}"></span><a th:if="${hasNext}" th:href="@{''(page=${page + 1},keyword=${param.keyword},category=${param.category})}">Next</a></nav></main><footer th:replace="~{fragments/navigation :: footer}"></footer></body>
</html>
