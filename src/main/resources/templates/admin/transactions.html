<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/site.css}">
  <title>Transactions — Admin</title>
<script defer th:src="@{/js/site.js}"></script>
</head>
<body class="admin-page" th:attr="data-context=@{/}"><a class="skip-link" href="#content">Skip to content</a>
<header th:replace="~{fragments/navigation :: header(compactHeader=true)}"></header>
<main id="content"><div class="section-line"><span>THE ADMINISTRATION DESK</span><span>REVIEW / RESOLVE / KEEP RECORD</span></div>

<nav class="admin-nav" aria-label="Administration"><a th:href="@{/admin/dashboard}">Overview</a><a th:href="@{/admin/users}">Users</a><a th:href="@{/admin/listings}">Listings</a><a th:href="@{/admin/transactions}">Transactions</a><a th:href="@{/admin/disputes}">Disputes</a></nav><h1>All Transactions</h1>

<div class="table-scroll" tabindex="0" aria-label="Scrollable records"><table >
  <thead>
    <tr>
      <th>#</th>
      <th>Item</th>
      <th>Buyer</th>
      <th>Seller</th>
      <th>State</th>
      <th>Updated</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
  <tr th:each="ledger : ${ledgers}">
    <td th:text="${ledger.ledgerId}"></td>
    <td th:text="${ledger.listingTitle}"></td>
    <td th:text="${ledger.buyerUsername}"></td>
    <td th:text="${ledger.sellerUsername}"></td>
    <td><span class="status-stamp" th:attr="data-status=${ledger.transactionState}" th:text="${ledger.transactionState == 'MEETUP_ARRANGED' ? 'Meetup confirmed' : #strings.capitalizeWords(#strings.toLowerCase(#strings.replace(ledger.transactionState, '_', ' ')))}"></span></td>
    <td th:text="${#temporals.format(ledger.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
    <td><a th:href="@{/handover/ledger/{id}(id=${ledger.ledgerId})}">View</a></td>
  </tr>
  </tbody>
</table></div>
<nav class="pagination" th:if="${page != null}" aria-label="Pagination"><a th:if="${page > 0}" th:href="@{''(page=${page - 1},keyword=${param.keyword},category=${param.category})}">Previous</a><span th:text="${'Page ' + (page + 1)}"></span><a th:if="${hasNext}" th:href="@{''(page=${page + 1},keyword=${param.keyword},category=${param.category})}">Next</a></nav></main><footer th:replace="~{fragments/navigation :: footer}"></footer></body>
</html>
