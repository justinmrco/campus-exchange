<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/site.css}">
  <title>My Listings — CampusExchange</title>
<script defer th:src="@{/js/site.js}"></script>
</head>
<body class="editorial-page" th:attr="data-context=@{/}"><a class="skip-link" href="#content">Skip to content</a>
<header th:replace="~{fragments/navigation :: header(compactHeader=true)}"></header>
<main id="content" class="my-listings" data-live="user" th:attr="data-revision=${eventRevision}"><div class="section-line"><span>02 / YOUR NOTICES</span><a th:href="@{/listing/create}">Post another item ↗</a></div><h1>Your corner of the classifieds.</h1><p class="intro">The things you're ready to pass on. All in one place.</p><div class="message" role="status" th:if="${message}" th:text="${message}"></div><div role="alert" th:if="${error}" th:text="${error}"></div><section class="empty-notice" th:if="${#lists.isEmpty(listings)}"><h2>Something gathering dust?</h2><p>Give it a place in the next edition.</p><a th:href="@{/listing/create}">Write your first notice ↗</a></section><section class="classified-grid" th:unless="${#lists.isEmpty(listings)}" aria-label="Your listings"><article class="classified" th:each="listing : ${listings}" th:attr="data-category=${listing.category}"><div class="ad-meta"><span th:text="${listing.category}"></span><span th:text="${'No. ' + listing.listingId}"></span></div><figure class="product-photo"><img th:if="${listing.imageUrl != null}" th:src="@{${listing.imageUrl}}" th:alt="${listing.title}" width="800" height="600" loading="lazy" decoding="async"><div class="no-photo" th:hidden="${listing.imageUrl != null}"><span aria-hidden="true">CE.</span><span>No photo provided</span></div></figure><h3><a th:href="@{/listing/{id}(id=${listing.listingId})}" th:text="${listing.title}"></a></h3><p class="ad-description" th:text="${listing.description}"></p><div class="ad-price">¥<span th:text="${listing.price}"></span></div><p><span class="status-stamp" th:attr="data-status=${listing.status}" th:text="${listing.status == 'MEETUP_ARRANGED' ? 'Meetup confirmed' : #strings.capitalizeWords(#strings.toLowerCase(#strings.replace(listing.status, '_', ' ')))}"></span></p><div class="ad-byline"><time th:text="${#temporals.format(listing.createdAt, 'dd MMM yyyy')}"></time></div><div class="ad-actions"><a th:href="@{/listing/{id}(id=${listing.listingId})}">Read notice ↗</a><a th:if="${listing.status == 'AVAILABLE'}" th:href="@{/listing/{id}/edit(id=${listing.listingId})}">Edit</a><form th:if="${listing.status == 'AVAILABLE'}" method="post" th:action="@{/listing/{id}/delete(id=${listing.listingId})}" data-confirm="Withdraw this listing from the classifieds? Its existing records will be retained." data-confirm-title="Withdraw your notice?" data-confirm-action="Withdraw listing" data-confirm-cancel="Keep listing" data-confirm-tone="destructive"><input type="hidden" name="_csrf" th:value="${csrf}"><button class="quiet" type="submit">Withdraw</button></form></div></article></section><nav class="pagination" th:if="${page != null}" aria-label="Pagination"><a th:if="${page > 0}" th:href="@{''(page=${page - 1},keyword=${param.keyword},category=${param.category})}">Previous</a><span th:text="${'Page ' + (page + 1)}"></span><a th:if="${hasNext}" th:href="@{''(page=${page + 1},keyword=${param.keyword},category=${param.category})}">Next</a></nav></main>
<footer th:replace="~{fragments/navigation :: footer}"></footer></body></html>
