spring.application.name=CampusExchange
spring.config.import=optional:file:./config/application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusexchange?serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:campusexchange}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=${TEMPLATE_CACHE:false}
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.sql.init.mode=never

# Local persistent uploads; back up this directory with the database.
app.upload-directory=${UPLOAD_DIRECTORY:uploads/listings}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
